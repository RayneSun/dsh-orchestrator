# dsh-orchestrator host bundle patch. Client artifact is discovered from package metadata.
- insert:
    - id: may-dsh-orchestrator
      name: '@cmjt/dsh-orchestrator'

    # ── 个人助理能力包：随本 bundle 自动安装启用 ──────────────────────
    # 跨会话长期记忆：由私有 npm 源的普通依赖自动安装。
    - id: dsh-personal-memory
      name: '@cmjt/dsh-personal-memory'

    # 生成式 UI：客户端渲染 Worker 卡片，Host 不依赖其实现。
    - id: dsh-genui
      name: '@changfenhuang/dsh-genui'

# 新会话默认使用主控助理预设；用户仍可在 DSH 的 preset 选择界面中主动切换。
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: standard
    selectedDefault: may-orchestrator-lead
