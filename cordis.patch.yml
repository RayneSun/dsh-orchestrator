# dsh-orchestrator host bundle patch. Client artifact is discovered from package metadata.
- insert:
    - id: may-dsh-orchestrator
      name: '@may/dsh-orchestrator'

    # ── 个人助理能力包：随本 bundle 自动安装启用 ──────────────────────
    # 跨会话长期记忆：工作区共享的唯一长期记忆库（SQLite，零原生依赖）。
    - id: meow-memory
      name: 'meow-memory'

    # 共享 Obsidian vault 知识库：vaultPath 随工作区自动解析（DSH_VAULT_PATH 可覆盖）。
    # kb_vault 根由 orchestrator 启动时自动初始化，session/assets 由归档任务按会话创建。
    - id: obsidian
      name: dsh-obsidian
      config:
        vaultPath: !!js "process.env.DSH_VAULT_PATH || (process.env.USERPROFILE || process.env.HOME) + '/Documents/deepseek-harness/default-workspace/kb_vault'"

    # 浏览器操作（独立 Agent Window，用户可旁观/接管）：代操作京东等个人平台。
    # 需用户自备 bsk CLI 与浏览器扩展，缺省时浏览器工具会给出自救指引。
    - id: browserskill
      name: '@wxg-prc-cpg/browser-skill-dsh-plugin'

    # QQ 邮箱（IMAP/SMTP）：默认只读，发信/删除/移动需用户在设置面板显式关闭只读。
    # 首次使用需用户填入 QQ 邮箱授权码。
    - id: qqmail
      name: '@zhengjunyao/dsh-qqmail'
      config:
        announceToAgent: true
        enabled: true
        readOnly: true

    # 桌面操控：按平台唯一启用一个驱动。macOS 驱动 vendored 在本包内，
    # 只使用宿主 DSH runtime；Windows 驱动用 peerDependencies，均不会引入旧版 tools。
    - id: computer-use-darwin
      name: '@may/dsh-orchestrator/dsh-computer-use-darwin'
      disabled: !!js "process.platform !== 'darwin'"
    - id: computer-use-win32
      name: '@milkuovo/dsh-computer-use'
      disabled: !!js "process.platform !== 'win32'"

# 新会话默认使用主控助理预设；用户仍可在 DSH 的 preset 选择界面中主动切换。
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: standard
    selectedDefault: may-orchestrator-lead
